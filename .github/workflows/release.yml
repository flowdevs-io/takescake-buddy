name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.17.0"
          cache: "npm"
          cache-dependency-path: overlay/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install overlay dependencies
        working-directory: overlay
        run: npm ci

      - name: Build Windows installer
        working-directory: overlay
        run: npm run make

      - name: Prepare release assets
        id: prepare-assets
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $installerPath = "overlay/dist-app/MTGA Tracker Setup $version.exe"
          $blockmapPath = "overlay/dist-app/MTGA Tracker Setup $version.exe.blockmap"
          $checksumPath = "overlay/dist-app/MTGA Tracker Setup $version.exe.sha256"

          foreach ($path in @($installerPath, $blockmapPath)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected release asset was not produced: $path"
            }
          }

          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -Value "$hash *$(Split-Path -Leaf $installerPath)"

          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
          "installer_path=$installerPath" | Add-Content -Path $env:GITHUB_OUTPUT
          "blockmap_path=$blockmapPath" | Add-Content -Path $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.prepare-assets.outputs.installer_path }}
            ${{ steps.prepare-assets.outputs.blockmap_path }}
            ${{ steps.prepare-assets.outputs.checksum_path }}
