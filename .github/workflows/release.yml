name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"
          cache: "npm"
          cache-dependency-path: overlay/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install overlay dependencies
        working-directory: overlay
        run: npm ci

      - name: Build Windows installers
        working-directory: overlay
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $releaseOutputPath = "..\dist-release"
          $stageOutputRootPath = "..\.release-staging"

          if (Test-Path -LiteralPath $releaseOutputPath) {
            Remove-Item -LiteralPath $releaseOutputPath -Recurse -Force
          }

          New-Item -ItemType Directory -Path $releaseOutputPath | Out-Null
          New-Item -ItemType Directory -Path $stageOutputRootPath -Force | Out-Null

          $architectures = @(
            @{ Name = "x64"; BunTarget = "bun-windows-x64"; BuilderArgument = "--x64" },
            @{ Name = "arm64"; BunTarget = "bun-windows-arm64"; BuilderArgument = "--arm64" }
          )

          foreach ($architecture in $architectures) {
            $architectureOutputPath = Join-Path $stageOutputRootPath $architecture.Name

            if (Test-Path -LiteralPath $architectureOutputPath) {
              Remove-Item -LiteralPath $architectureOutputPath -Recurse -Force
            }

            New-Item -ItemType Directory -Path $architectureOutputPath | Out-Null

            $env:BUN_BACKEND_TARGET = $architecture.BunTarget
            npm run make -- $architecture.BuilderArgument "-c.directories.output=$architectureOutputPath"
            if ($LASTEXITCODE -ne 0) {
              throw "npm run make failed for Windows $($architecture.Name) (exit code $LASTEXITCODE)."
            }

            $installerPath = Join-Path $architectureOutputPath "MTGA Tracker Setup $version.exe"
            $blockmapPath = "$installerPath.blockmap"

            foreach ($path in @($installerPath, $blockmapPath)) {
              if (-not (Test-Path -LiteralPath $path)) {
                throw "Expected release asset was not produced: $path"
              }
            }

            $releaseInstallerName = "MTGA Tracker Setup $version-$($architecture.Name).exe"
            $releaseInstallerPath = Join-Path $releaseOutputPath $releaseInstallerName

            Copy-Item -LiteralPath $installerPath -Destination $releaseInstallerPath -Force
            Copy-Item -LiteralPath $blockmapPath -Destination "$releaseInstallerPath.blockmap" -Force

            $hash = (Get-FileHash -LiteralPath $releaseInstallerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "$releaseInstallerPath.sha256" -Value "$hash *$releaseInstallerName"
          }

          Remove-Item Env:\BUN_BACKEND_TARGET -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $releaseOutputPath -File | Select-Object -ExpandProperty Name

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-release/*
